name: Consolidation regression verification
on:
  push:
    branches: ["ci/verify-consolidated-837-838-846-848"]
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun lint
      - name: Typecheck
        run: bun typecheck
      - name: Tests
        run: bun run test
      - name: Coverage
        run: bun run test:coverage
