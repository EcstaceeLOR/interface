name: Commit gate diagnostics (temporary)
on:
  push:
    branches: ["fix/upstream-commit-gate-baseline"]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        if: ${{ success() || failure() }}
        run: bun lint
      - name: Typecheck
        if: ${{ success() || failure() }}
        run: bun typecheck
      - name: Design tokens
        if: ${{ success() || failure() }}
        run: bun run check:tokens
      - name: Docs content
        if: ${{ success() || failure() }}
        run: bun run check:content
      - name: Unit tests
        if: ${{ success() || failure() }}
        run: bun run test
      - name: Coverage
        if: ${{ success() || failure() }}
        run: bun run test:coverage
      - name: Build
        if: ${{ success() || failure() }}
        run: bun run build
      - name: Indexer codegen
        if: ${{ success() || failure() }}
        run: bun run --cwd apps/s03-indexer codegen
      - name: Indexer build
        if: ${{ success() || failure() }}
        run: bun run --cwd apps/s03-indexer build
      - name: Indexer tests
        if: ${{ success() || failure() }}
        run: bun run --cwd apps/s03-indexer test
      - name: Indexer local manifest
        if: ${{ success() || failure() }}
        run: |
          SO4_CONTRACTS_REPO="$PWD/apps/s03-indexer/tests/fixtures/contracts-repo" bun run --cwd apps/s03-indexer sync:contracts:local
          bash scripts/validate-manifest.sh apps/s03-indexer/config/contracts.local.json
      - name: Web typecheck
        if: ${{ success() || failure() }}
        run: bun run --cwd apps/web typecheck
      - name: Web build
        if: ${{ success() || failure() }}
        run: bun run --cwd apps/web build
